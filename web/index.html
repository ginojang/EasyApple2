<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyApple2 — Web</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 12px;
      }
      #screen {
        background: #000;
        border: 1px solid #333;
        width: min(90vw, 840px);
        height: auto;
        aspect-ratio: 280 / 192;
        display: block;
      }
      body:focus-within #screen { outline: 1px solid #444; }
      #status {
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="280" height="192"></canvas>
    <div id="status">booting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
